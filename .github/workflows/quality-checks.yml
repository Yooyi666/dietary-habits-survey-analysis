name: Portfolio quality checks
on:
  push:
  pull_request:
jobs:
  verify-public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify files and public-data boundaries
        run: python qa/check_repository.py
